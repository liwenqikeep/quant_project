[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant"
version = "0.1.0"
description = "量化交易回测框架"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "akshare>=1.13.0",
    "tushare>=1.4.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "tqdm>=4.65.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
# 可选依赖
ext = [
    "flask>=2.0.0",
    "flask-cors>=4.0.0",
]
ml = [
    "scipy>=1.10.0",
]
sentiment = [
    "snownlp>=0.12.0",
    "transformers>=4.30.0",
]
all = [
    "flask>=2.0.0",
    "flask-cors>=4.0.0",
    "scipy>=1.10.0",
    "snownlp>=0.12.0",
    "transformers>=4.30.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quant*"]

[tool.pytest.ini_options]
testpaths = ["quant/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
