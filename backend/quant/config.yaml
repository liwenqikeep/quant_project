# ========== 量化项目配置 ==========

# 数据配置
data:
  # 数据存储根目录（可配置为绝对路径，或相对 backend 运行目录的相对路径）
  # 数据子目录：tmp=临时缓存 / raw=原始数据 / processed=处理后数据
  data_dir: "d:/desk/code/personal/data"
  tmp_dir: "tmp"
  raw_dir: "raw"
  processed_dir: "processed"

  # 默认复权类型："" / qfq / hfq
  adjust: "qfq"

  # 数据存储格式：sqlite（当前）| parquet（预留）
  storage:
    format: "sqlite"

  # 数据获取配置
  fetch:
    default_time: "17:30"       # 全局默认获取时间（HH:MM）
    target_date_mode: "last_trade_date"   # last_trade_date | today
    stale_tolerance_trading_days: 1
    retry: 3                    # 失败重试次数
    timeout_seconds: 20         # 单请求超时（秒）
    backoff_base_seconds: 1     # 指数退避基数
    incremental: true           # 是否增量续拉
    lookback_days: 10           # 增量尾部重叠窗口（自然日），校准用
    backfill_start: "20000101"  # 首次全量回填起点
    batch_size: 20             # 每批标的数
    max_workers: 1              # 并发请求数（默认 1 防限流）
    request_interval_seconds: 0.5
    schedule:
      enabled: true
      weekdays: [1, 2, 3, 4, 5] # 周一至周五
      catch_up: true            # 错过触发时间后补跑
    calibration:
      enabled: true
      price_tolerance: 0.001
      volume_tolerance: 0.01
      auto_correct_drift: true
      alert_on_discrepancy: true
  
  # 数据源配置
  sources:
    default: "akshare"  # 默认数据源
    akshare:
      enabled: true
    tushare:
      enabled: false
      token: "your_token_here"  # 请填入你的Tushare Token
  
  # 默认股票池
  stock_pool:
    - "000001.SZ"  # 平安银行
    - "000002.SZ"  # 万科A
    - "600000.SH"  # 浦发银行
    - "600519.SH"  # 贵州茅台

# 策略配置
strategy:
  # 初始资金
  initial_cash: 1000000
  
  # 交易费用
  commission: 0.0003        # 万三佣金
  stamp_tax: 0.0005         # 万分之五印花税（卖出时收取，2023年8月起生效）
  slippage: 0.0             # 滑点（bps，买入上浮、卖出下浮，默认0）
  min_commission: 5.0      # 最低佣金（元，A股默认5元）
  min_commission_enabled: true  # 是否启用最低佣金
  
  # 执行价格策略
  # "next_open": 次日开盘价执行（推荐，消除未来函数）
  # "next_close": 次日收盘价执行（更保守）
  execution_price: "next_open"
  
  # 回测时间范围
  backtest_start: "20200101"
  backtest_end: "20231231"

# 模型配置
model:
  # 模型保存路径
  model_path: "models"
  
  # 特征配置
  features:
    technical:
      - "MA5"
      - "MA10"
      - "MA20"
      - "RSI"
      - "MACD"
      - "BOLL"
    fundamental:
      - "pe_ratio"
      - "pb_ratio"
      - "turnover_rate"
  
  # 训练配置
  train:
    test_size: 0.2
    random_state: 42

# 日志配置
logging:
  level: "INFO"
  log_dir: "logs"
  rotation: "100 MB"
  retention: "30 days"
